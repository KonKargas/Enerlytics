# =====================================
# Enerlytics - Application Configuration
# =====================================
spring.application.name=enerlytics
server.port=8080

# SQLite - local database file (created in the app's working directory)
spring.datasource.url=jdbc:sqlite:enerlytics.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8


# Character encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Upload limits (semicolon-separated UCI format)
spring.servlet.multipart.enabled=true

# Enerlytics ETL Pipeline
enerlytics.etl.enabled=false
enerlytics.etl.load.enabled=false

spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=251MB
